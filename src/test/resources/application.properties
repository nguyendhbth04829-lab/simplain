spring.application.name=SimplainTest
server.port=8080

spring.datasource.url=jdbc:h2:mem:simpl4test;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

simplain.jwt.secret=simplain-secret-key-for-jwt-token-authentication-secure-256-bits-2026!
simplain.jwt.expiration-ms=86400000
simplain.jwt.issuer=simplain-auth
