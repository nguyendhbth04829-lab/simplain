<!-- 
    Tác giả: Gia Minh
    Chức năng: US12 - Giao diện xem và cập nhật hồ sơ cá nhân của khách hàng
-->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ cá nhân - Simplain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loi { color: #ef4444; font-size: 0.875rem; margin-top: 0.25rem; display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex justify-between items-center mb-8 border-b pb-4">
        <div>
            <h2 class="text-3xl font-bold text-gray-900 tracking-wide uppercase">Hồ Sơ Cá Nhân</h2>
            <p class="text-sm text-gray-500 mt-1">Quản lý và cập nhật thông tin tài khoản khách hàng (US12)</p>
        </div>
        <div>
            <a th:href="@{|/khach-hang/doi-mat-khau?id=${idKhachHang}|}" 
               class="bg-white border border-gray-300 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-100 text-sm font-medium transition shadow-sm">
                Đổi mật khẩu →
            </a>
        </div>
    </div>

    <!-- Thông báo thành công / lỗi -->
    <div th:if="${thongBaoThanhCong}" class="mb-6 p-4 rounded-md bg-green-50 border border-green-200 text-green-800 text-sm flex items-center">
        <span class="font-bold mr-2">✓</span> <span th:text="${thongBaoThanhCong}"></span>
    </div>
    <div th:if="${thongBaoLoi}" class="mb-6 p-4 rounded-md bg-red-50 border border-red-200 text-red-800 text-sm flex items-center">
        <span class="font-bold mr-2">✕</span> <span th:text="${thongBaoLoi}"></span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Khối thông tin tổng quan -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 text-center h-fit">
            <div class="w-28 h-28 mx-auto rounded-full overflow-hidden bg-gray-100 border border-gray-200 flex items-center justify-center mb-4">
                <img th:if="${hoSo != null and hoSo.anhDaiDien != null and hoSo.anhDaiDien != ''}" 
                     th:src="${hoSo.anhDaiDien}" alt="Avatar" class="w-full h-full object-cover">
                <span th:unless="${hoSo != null and hoSo.anhDaiDien != null and hoSo.anhDaiDien != ''}" class="text-4xl text-gray-400">👤</span>
            </div>
            <h3 class="text-xl font-bold text-gray-900" th:text="${hoSo != null ? hoSo.hoTen : 'Chưa cập nhật'}"></h3>
            <p class="text-sm text-gray-500 mt-1" th:text="'Mã: ' + (${hoSo != null ? hoSo.maKhachHang : '-'})"></p>

            <div class="mt-6 pt-4 border-t border-gray-100 text-left text-sm space-y-2">
                <div><span class="text-gray-500">Trạng thái:</span> 
                    <span th:if="${hoSo != null and hoSo.trangThai == 1}" class="px-2 py-0.5 text-xs font-semibold rounded bg-green-100 text-green-800">Hoạt động</span>
                    <span th:unless="${hoSo != null and hoSo.trangThai == 1}" class="px-2 py-0.5 text-xs font-semibold rounded bg-red-100 text-red-800">Bị khóa</span>
                </div>
                <div><span class="text-gray-500">Giới tính:</span> <span class="font-medium" th:text="${hoSo != null and hoSo.gioiTinh != null ? hoSo.gioiTinh : 'Chưa chọn'}"></span></div>
                <div><span class="text-gray-500">Ngày sinh:</span> <span class="font-medium" th:text="${hoSo != null and hoSo.ngaySinh != null ? hoSo.ngaySinh : 'Chưa cập nhật'}"></span></div>
            </div>
        </div>

        <!-- Form cập nhật hồ sơ -->
        <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h3 class="text-xl font-semibold mb-6 border-b pb-3">Cập Nhật Thông Tin Cá Nhân</h3>

            <form th:object="${capNhatRequest}" th:action="@{|/khach-hang/cap-nhat?id=${idKhachHang}|}" method="post" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Họ và tên <span class="text-red-500">*</span></label>
                    <input type="text" th:field="*{hoTen}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none focus:border-black transition text-sm">
                    <span class="loi" th:if="${#fields.hasErrors('hoTen')}" th:errors="*{hoTen}"></span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Số điện thoại</label>
                        <input type="text" th:field="*{soDienThoai}" placeholder="0987654321" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none focus:border-black transition text-sm">
                        <span class="loi" th:if="${#fields.hasErrors('soDienThoai')}" th:errors="*{soDienThoai}"></span>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" th:field="*{email}" placeholder="example@gmail.com" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none focus:border-black transition text-sm">
                        <span class="loi" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Giới tính</label>
                        <select th:field="*{gioiTinh}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none bg-white text-sm">
                            <option value="">-- Chọn giới tính --</option>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <span class="loi" th:if="${#fields.hasErrors('gioiTinh')}" th:errors="*{gioiTinh}"></span>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Ngày sinh</label>
                        <input type="date" th:field="*{ngaySinh}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none focus:border-black transition text-sm">
                        <span class="loi" th:if="${#fields.hasErrors('ngaySinh')}" th:errors="*{ngaySinh}"></span>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Đường dẫn ảnh đại diện (URL)</label>
                    <input type="text" th:field="*{anhDaiDien}" placeholder="https://example.com/avatar.jpg" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none focus:border-black transition text-sm">
                    <span class="loi" th:if="${#fields.hasErrors('anhDaiDien')}" th:errors="*{anhDaiDien}"></span>
                </div>

                <div class="pt-4 flex gap-4">
                    <button type="submit" class="flex-1 bg-black text-white font-medium py-2.5 px-4 rounded hover:bg-gray-800 transition duration-150 text-sm">
                        LƯU THAY ĐỔI
                    </button>
                    <a th:href="@{|/khach-hang/ho-so?id=${idKhachHang}|}" class="text-center bg-gray-100 border border-gray-300 text-gray-700 font-medium py-2.5 px-6 rounded hover:bg-gray-200 transition duration-150 text-sm">
                        Hủy
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
