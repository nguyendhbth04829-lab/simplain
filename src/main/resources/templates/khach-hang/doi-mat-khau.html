<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - Simplain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loi { color: #ef4444; font-size: 0.875rem; margin-top: 0.25rem; display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-900 tracking-wide uppercase">Đổi Mật Khẩu</h2>
                <p class="text-xs text-gray-500 mt-1">Cập nhật mật khẩu mới an toàn cho tài khoản</p>
            </div>
            <a th:href="@{|/khach-hang/ho-so?id=${idKhachHang}|}" class="text-sm text-gray-500 hover:text-black transition">
                ← Về hồ sơ
            </a>
        </div>

        <!-- Thông báo thành công / lỗi -->
        <div th:if="${thongBaoThanhCong}" class="mb-5 p-4 rounded-md bg-green-50 border border-green-200 text-green-800 text-sm flex items-center">
            <span class="font-bold mr-2">✓</span> <span th:text="${thongBaoThanhCong}"></span>
        </div>
        <div th:if="${thongBaoLoi}" class="mb-5 p-4 rounded-md bg-red-50 border border-red-200 text-red-800 text-sm flex items-center">
            <span class="font-bold mr-2">✕</span> <span th:text="${thongBaoLoi}"></span>
        </div>

        <form th:object="${doiMatKhauRequest}" th:action="@{|/khach-hang/doi-mat-khau?id=${idKhachHang}|}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700">Mật khẩu hiện tại <span class="text-red-500">*</span></label>
                <input type="password" th:field="*{matKhauCu}" placeholder="Nhập mật khẩu cũ của bạn" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none focus:border-black transition text-sm">
                <span class="loi" th:if="${#fields.hasErrors('matKhauCu')}" th:errors="*{matKhauCu}"></span>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Mật khẩu mới <span class="text-red-500">*</span></label>
                <input type="password" th:field="*{matKhauMoi}" placeholder="Tối thiểu 6 ký tự" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none focus:border-black transition text-sm">
                <span class="loi" th:if="${#fields.hasErrors('matKhauMoi')}" th:errors="*{matKhauMoi}"></span>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Xác nhận mật khẩu mới <span class="text-red-500">*</span></label>
                <input type="password" th:field="*{xacNhanMatKhauMoi}" placeholder="Nhập lại mật khẩu mới" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2.5 border outline-none focus:border-black transition text-sm">
                <span class="loi" th:if="${#fields.hasErrors('xacNhanMatKhauMoi')}" th:errors="*{xacNhanMatKhauMoi}"></span>
            </div>

            <div class="pt-4 flex gap-4">
                <button type="submit" class="flex-1 bg-black text-white font-medium py-2.5 px-4 rounded hover:bg-gray-800 transition duration-150 text-sm">
                    ĐỔI MẬT KHẨU
                </button>
                <a th:href="@{|/khach-hang/ho-so?id=${idKhachHang}|}" class="text-center bg-gray-100 border border-gray-300 text-gray-700 font-medium py-2.5 px-6 rounded hover:bg-gray-200 transition duration-150 text-sm">
                    Hủy
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
