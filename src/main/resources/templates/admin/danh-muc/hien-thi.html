<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh mục</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .error { color: #ef4444; font-size: 0.875rem; margin-top: 0.25rem; display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h2 class="text-3xl font-bold text-gray-900 mb-8 uppercase tracking-wide">Quản lý Danh mục</h2>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Form thêm mới -->
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 h-fit">
            <h3 class="text-xl font-semibold mb-4 border-b pb-2">Thêm Mới</h3>
            <form th:object="${danhMuc}" action="/admin/danh-muc/add" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Tên danh mục</label>
                    <input type="text" th:field="*{tenDanhMuc}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border outline-none transition">
                    <span class="error" th:if="${#fields.hasErrors('tenDanhMuc')}" th:errors="*{tenDanhMuc}"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Đường dẫn slug</label>
                    <input type="text" th:field="*{duongDanSlug}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border outline-none transition">
                    <span class="error" th:if="${#fields.hasErrors('duongDanSlug')}" th:errors="*{duongDanSlug}"></span>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Danh mục cha</label>
                    <select th:field="*{maDanhMucCha}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border outline-none bg-white">
                        <option value="">-- Không có --</option>
                        <option th:each="dm : ${listTatCa}" th:value="${dm.id}" th:text="${dm.tenDanhMuc}"></option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Thứ tự hiển thị</label>
                    <input type="number" th:field="*{thuTuHienThi}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
                    <div class="flex items-center space-x-4">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" th:field="*{kichHoat}" value="true" class="text-black focus:ring-black w-4 h-4">
                            <span class="ml-2 text-sm text-gray-600">Hoạt động</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" th:field="*{kichHoat}" value="false" class="text-black focus:ring-black w-4 h-4">
                            <span class="ml-2 text-sm text-gray-600">Ngừng</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full bg-black text-white font-medium py-2.5 px-4 rounded hover:bg-gray-800 transition duration-150 mt-4">THÊM MỚI</button>
            </form>
        </div>

        <!-- Bảng hiển thị -->
        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 border-b pb-4 gap-4">
                <h3 class="text-xl font-semibold">Danh Sách</h3>
                <!-- Form tìm kiếm -->
                <form action="/admin/danh-muc/hien-thi" method="get" class="flex w-full sm:w-auto">
                    <input type="text" name="ten" th:value="${ten}" placeholder="Tìm kiếm danh mục..." class="rounded-l-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border flex-grow outline-none">
                    <button type="submit" class="bg-gray-100 border border-l-0 border-gray-300 text-black px-4 py-2 rounded-r-md hover:bg-gray-200 transition duration-150 font-medium">Tìm</button>
                </form>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Danh mục</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Mục cha</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thứ tự</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trạng thái</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Hành động</th>
                    </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="dm : ${listDanhMuc}" class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-medium text-gray-900" th:text="${dm.tenDanhMuc}"></div>
                            <div class="text-xs text-gray-500 mt-1" th:text="'Slug: ' + ${dm.duongDanSlug}"></div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${dm.maDanhMucCha != null ? dm.maDanhMucCha : '-'}"></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${dm.thuTuHienThi}"></td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span th:if="${dm.kichHoat}" class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Hoạt động</span>
                            <span th:unless="${dm.kichHoat}" class="px-2.5 py-1 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Đã ẩn</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <a th:href="@{|/admin/danh-muc/view?id=${dm.id}|}" class="text-blue-600 hover:text-blue-900 mr-3">Sửa</a>
                            <a th:href="@{|/admin/danh-muc/delete?id=${dm.id}|}" onclick="return confirm('Bạn có chắc muốn xoá?');" class="text-red-600 hover:text-red-900">Xoá</a>
                        </td>
                    </tr>
                    <tr th:if="${listDanhMuc.empty}">
                        <td colspan="5" class="px-6 py-8 text-center text-gray-500">Không tìm thấy dữ liệu.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Phân trang -->
            <div class="mt-6 flex items-center justify-between" th:if="${totalPages > 1}">
                <a th:if="${page > 0}" th:href="@{|/admin/danh-muc/hien-thi?page=${page - 1}&ten=${ten != null ? ten : ''}|}" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 text-sm font-medium transition">Trước</a>
                <span th:if="${page == 0}" class="bg-gray-50 border border-gray-200 text-gray-400 px-4 py-2 rounded-md cursor-not-allowed text-sm font-medium">Trước</span>
                
                <span class="text-sm text-gray-700 font-medium" th:text="${'Trang ' + (page + 1) + ' / ' + totalPages}"></span>
                
                <a th:if="${page < totalPages - 1}" th:href="@{|/admin/danh-muc/hien-thi?page=${page + 1}&ten=${ten != null ? ten : ''}|}" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 text-sm font-medium transition">Sau</a>
                <span th:if="${page >= totalPages - 1}" class="bg-gray-50 border border-gray-200 text-gray-400 px-4 py-2 rounded-md cursor-not-allowed text-sm font-medium">Sau</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
