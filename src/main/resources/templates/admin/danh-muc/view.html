<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật Danh mục</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .error { color: #ef4444; font-size: 0.875rem; margin-top: 0.25rem; display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold text-gray-900 uppercase tracking-wide">Cập nhật Danh mục</h2>
            <a href="/admin/danh-muc/hien-thi" class="text-sm text-gray-500 hover:text-black transition">← Quay lại</a>
        </div>

        <form th:object="${danhMuc}" action="/admin/danh-muc/update" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700">ID</label>
                <input type="text" th:field="*{id}" readonly class="mt-1 block w-full rounded-md border-gray-300 bg-gray-100 text-gray-500 sm:text-sm p-2 border outline-none cursor-not-allowed">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Tên danh mục</label>
                <input type="text" th:field="*{tenDanhMuc}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border outline-none transition">
                <span class="error" th:if="${#fields.hasErrors('tenDanhMuc')}" th:errors="*{tenDanhMuc}"></span>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Đường dẫn slug</label>
                <input type="text" th:field="*{duongDanSlug}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border outline-none transition">
                <span class="error" th:if="${#fields.hasErrors('duongDanSlug')}" th:errors="*{duongDanSlug}"></span>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Danh mục cha</label>
                <select th:field="*{maDanhMucCha}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border outline-none bg-white">
                    <option value="">-- Không có --</option>
                    <option th:each="dm : ${listTatCa}" 
                            th:value="${dm.id}" 
                            th:text="${dm.tenDanhMuc}"
                            th:if="${dm.id != danhMuc.id}"> <!-- Không chọn chính nó làm cha -->
                    </option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Thứ tự hiển thị</label>
                <input type="number" th:field="*{thuTuHienThi}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-black focus:ring-black sm:text-sm p-2 border outline-none transition">
            </div>

            <div class="pt-2">
                <label class="block text-sm font-medium text-gray-700 mb-2">Trạng thái</label>
                <div class="flex items-center space-x-6">
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" th:field="*{kichHoat}" value="true" class="text-black focus:ring-black w-4 h-4">
                        <span class="ml-2 text-sm text-gray-700">Hoạt động</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" th:field="*{kichHoat}" value="false" class="text-black focus:ring-black w-4 h-4">
                        <span class="ml-2 text-sm text-gray-700">Ngừng</span>
                    </label>
                </div>
            </div>

            <div class="pt-4 flex gap-4">
                <button type="submit" class="flex-1 bg-black text-white font-medium py-2.5 px-4 rounded hover:bg-gray-800 transition duration-150">CẬP NHẬT</button>
                <a href="/admin/danh-muc/hien-thi" class="flex-1 text-center bg-white border border-gray-300 text-gray-700 font-medium py-2.5 px-4 rounded hover:bg-gray-50 transition duration-150">HỦY BỎ</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
