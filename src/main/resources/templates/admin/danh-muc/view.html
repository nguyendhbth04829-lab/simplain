<!-- 
    Tác giả: Nhóm Simplain & Gia Minh
    Chức năng: Cập nhật thông tin Danh Mục (Phiên bản Đột Phá 2026)
-->
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Danh Mục • Simplain Admin</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .error { color: #e11d48; font-size: 0.8125rem; margin-top: 0.35rem; display: block; font-weight: 500; }
    </style>
</head>
<body class="bg-[#fafafa] text-zinc-900 antialiased min-h-screen flex flex-col justify-between selection:bg-black selection:text-white">

<!-- Header Admin -->
<header class="bg-white/90 backdrop-blur-md border-b border-zinc-200/80 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex items-center space-x-6">
                <a href="/" class="flex flex-col">
                    <span class="text-3xl font-black tracking-widest text-black uppercase font-sans leading-none">
                        SIMPLAIN
                    </span>
                    <span class="text-[9px] tracking-[0.3em] uppercase text-zinc-400 font-bold mt-1">ADMINISTRATOR PORTAL</span>
                </a>
                <span class="hidden md:inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-zinc-900 text-white">
                    <i class="fa-solid fa-pen-to-square text-zinc-400"></i> Cập Nhật Danh Mục
                </span>
            </div>

            <div class="flex items-center space-x-3">
                <a href="/admin/danh-muc/hien-thi" class="text-xs font-bold bg-zinc-100 hover:bg-zinc-200 text-zinc-800 px-3.5 py-2 rounded-xl transition">
                    ← Danh Sách Danh Mục
                </a>
            </div>
        </div>
    </div>
</header>

<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full flex-1">
    
    <div class="bg-white border border-zinc-200/80 rounded-3xl p-8 sm:p-10 shadow-xs">
        <div class="flex justify-between items-start pb-6 border-b border-zinc-200 mb-8">
            <div>
                <h2 class="text-2xl font-black uppercase tracking-tight text-zinc-950">Cập Nhật Danh Mục</h2>
                <p class="text-xs text-zinc-500 mt-1">Chỉnh sửa thông tin định danh và phân cấp danh mục ngành hàng</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-mono font-bold bg-zinc-100 text-zinc-700">
                ID: <span th:text="${danhMuc.id}">1</span>
            </span>
        </div>

        <form th:object="${danhMuc}" action="/admin/danh-muc/update" method="post" class="space-y-6">
            <input type="hidden" th:field="*{id}">

            <div>
                <label class="block text-xs font-bold text-zinc-700 uppercase tracking-wider mb-2">
                    Tên danh mục <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <input type="text" th:field="*{tenDanhMuc}" id="inputTenDM" oninput="tuDongTaoSlugDM(this.value)"
                           class="w-full rounded-xl border border-zinc-300 p-3.5 pl-10 text-sm font-semibold outline-none focus:border-black focus:ring-1 focus:ring-black transition">
                    <i class="fa-solid fa-shirt absolute left-3.5 top-4 text-zinc-400 text-sm"></i>
                </div>
                <span class="error" th:if="${#fields.hasErrors('tenDanhMuc')}" th:errors="*{tenDanhMuc}"></span>
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-700 uppercase tracking-wider mb-2">
                    Đường dẫn Slug <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <input type="text" th:field="*{duongDanSlug}" id="inputSlugDM"
                           class="w-full rounded-xl border border-zinc-300 p-3.5 pl-10 text-sm font-mono font-semibold outline-none focus:border-black focus:ring-1 focus:ring-black transition">
                    <i class="fa-solid fa-link absolute left-3.5 top-4 text-zinc-400 text-sm"></i>
                </div>
                <span class="error" th:if="${#fields.hasErrors('duongDanSlug')}" th:errors="*{duongDanSlug}"></span>
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-700 uppercase tracking-wider mb-2">
                    Danh mục cha
                </label>
                <select th:field="*{maDanhMucCha}" 
                        class="w-full rounded-xl border border-zinc-300 p-3.5 text-sm font-semibold outline-none bg-white focus:border-black focus:ring-1 focus:ring-black transition">
                    <option value="">-- Cấp cao nhất (Không có cha) --</option>
                    <option th:each="dm : ${listTatCa}" th:value="${dm.id}" th:text="${dm.tenDanhMuc}"></option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-700 uppercase tracking-wider mb-2">
                    Thứ tự hiển thị
                </label>
                <input type="number" th:field="*{thuTuHienThi}" 
                       class="w-full rounded-xl border border-zinc-300 p-3.5 text-sm font-semibold outline-none focus:border-black focus:ring-1 focus:ring-black transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-zinc-700 uppercase tracking-wider mb-2">
                    Trạng thái
                </label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center gap-2.5 p-3.5 rounded-xl border border-zinc-300 cursor-pointer hover:bg-zinc-50 transition text-xs font-bold">
                        <input type="radio" th:field="*{kichHoat}" value="true" class="text-black focus:ring-black">
                        <span class="flex items-center gap-1.5 text-emerald-700">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Hoạt động
                        </span>
                    </label>
                    <label class="flex items-center gap-2.5 p-3.5 rounded-xl border border-zinc-300 cursor-pointer hover:bg-zinc-50 transition text-xs font-bold">
                        <input type="radio" th:field="*{kichHoat}" value="false" class="text-black focus:ring-black">
                        <span class="flex items-center gap-1.5 text-zinc-500">
                            <span class="w-2 h-2 rounded-full bg-zinc-400"></span> Tạm dừng
                        </span>
                    </label>
                </div>
            </div>

            <div class="pt-6 border-t border-zinc-200 flex justify-end gap-3">
                <a href="/admin/danh-muc/hien-thi" 
                   class="px-6 py-3.5 rounded-xl border border-zinc-300 text-zinc-700 font-bold text-xs uppercase hover:bg-zinc-50 transition">
                    Hủy Bỏ
                </a>
                <button type="submit" 
                        class="px-8 py-3.5 rounded-xl bg-black text-white font-bold text-xs uppercase tracking-wider hover:bg-zinc-800 transition shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Lưu Cập Nhật</span>
                </button>
            </div>
        </form>
    </div>
</main>

<footer class="bg-white border-t border-zinc-200 py-10 text-center text-xs text-zinc-400 mt-16">
    <p>© 2026 Simplain Menswear Administrator. Hệ thống điều hành thương mại điện tử.</p>
</footer>

<script>
    function tuDongTaoSlugDM(ten) {
        if (!ten) return;
        const slug = ten.toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/g, 'd').replace(/Đ/g, 'D')
            .replace(/[^a-z0-9\s-]/g, '')
            .trim().replace(/\s+/g, '-');
        document.getElementById('inputSlugDM').value = slug;
    }
</script>

</body>
</html>
