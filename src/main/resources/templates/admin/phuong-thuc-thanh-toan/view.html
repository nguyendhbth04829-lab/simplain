<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa cổng thanh toán | Simplain Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body{font-family:'Inter',sans-serif}.error{color:#ef4444;font-size:.8rem;margin-top:.25rem;display:block}</style>
</head>
<body class="bg-[#f2f3f5] text-[#1a1d28]">
<header class="bg-black text-white border-b-2 border-black">
    <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">
        <span class="font-extrabold text-lg">SIMPLAIN<span class="text-xs text-gray-400 ml-1">ADMIN</span></span>
        <a href="/admin/phuong-thuc-thanh-toan/hien-thi" class="text-sm text-gray-300 hover:text-white">← Quay lại danh sách</a>
    </div>
</header>
<div class="max-w-3xl mx-auto px-6 py-8">
    <div class="bg-white border border-gray-200 border-t-4 border-t-black p-8 shadow-sm rounded-none">
        <p class="text-xs font-semibold tracking-widest text-gray-400 uppercase">Simplain • US18 • Cập nhật</p>
        <h2 class="text-2xl font-extrabold mb-6">Sửa cổng thanh toán</h2>
        <form th:object="${phuongThuc}" action="/admin/phuong-thuc-thanh-toan/update" method="post" class="space-y-4">
            <input type="hidden" th:field="*{id}">
            <div>
                <label class="text-xs font-semibold uppercase tracking-wide text-gray-500">Mã phương thức *</label>
                <input type="text" th:field="*{maPhuongThuc}" class="mt-1 w-full border border-gray-300 p-2.5 text-sm outline-none focus:border-black uppercase rounded-lg">
                <span class="error" th:if="${#fields.hasErrors('maPhuongThuc')}" th:errors="*{maPhuongThuc}"></span>
            </div>
            <div>
                <label class="text-xs font-semibold uppercase tracking-wide text-gray-500">Tên hiển thị *</label>
                <input type="text" th:field="*{tenPhuongThuc}" class="mt-1 w-full border border-gray-300 p-2.5 text-sm outline-none focus:border-black rounded-lg">
                <span class="error" th:if="${#fields.hasErrors('tenPhuongThuc')}" th:errors="*{tenPhuongThuc}"></span>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <label class="border border-gray-300 p-4 flex items-center gap-3 cursor-pointer rounded-lg hover:border-black">
                    <input type="checkbox" th:field="*{laTrucTuyen}" class="w-5 h-5 accent-black">
                    <span><b class="text-sm block">Trực tuyến</b><i class="text-xs text-gray-400 not-italic">VNPay / MoMo quét QR</i></span>
                </label>
                <label class="border border-gray-300 p-4 flex items-center gap-3 cursor-pointer rounded-lg hover:border-black">
                    <input type="checkbox" th:field="*{kichHoat}" class="w-5 h-5 accent-black">
                    <span><b class="text-sm block">Kích hoạt</b><i class="text-xs text-gray-400 not-italic">Tắt sẽ ẩn ở Checkout</i></span>
                </label>
            </div>
            <div class="flex gap-3 pt-2">
                <button class="flex-1 bg-black text-white font-bold py-3 text-sm hover:bg-gray-800 rounded-lg">LƯU THAY ĐỔI</button>
                <a href="/admin/phuong-thuc-thanh-toan/hien-thi" class="flex-1 text-center border border-black font-bold py-3 text-sm hover:bg-gray-100 rounded-lg">HỦY</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
