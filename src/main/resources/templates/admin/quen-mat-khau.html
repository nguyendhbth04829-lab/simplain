<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khôi phục Mật khẩu CMS | SIMPLAIN STORE</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="bg-[#f8fafc] text-neutral-800 flex flex-col min-h-screen">

    <!-- Header CMS (Dark Navy) -->
    <header class="border-b border-slate-800 bg-[#0a192f]">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-black tracking-widest uppercase text-white">SIMPLAIN<span class="text-blue-500">.</span></span>
                <span class="text-[10px] font-bold bg-blue-600 text-white px-2 py-0.5 rounded tracking-wider uppercase shadow-xs shadow-blue-500/30">CMS PORTAL</span>
            </div>
            <div class="flex items-center space-x-4 text-xs font-semibold">
                <a href="/admin/dang-nhap" class="text-slate-300 hover:text-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left text-xs text-blue-400"></i>
                    <span>Quay lại Đăng nhập CMS</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-10 px-4">
        <div class="w-full max-w-md">

            <!-- Card Quên mật khẩu CMS -->
            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8 sm:p-10">

                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-[#0a192f] text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-slate-700 shadow-md">
                        <i class="fa-solid fa-user-shield text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-black uppercase tracking-tight text-slate-900">Khôi phục Tài khoản CMS</h1>
                    <p class="text-xs text-slate-500 mt-1">Dành cho Nhân viên &amp; Ban Quản trị SIMPLAIN qua Gmail</p>
                </div>

                <!-- Step Indicator -->
                <div class="flex items-center justify-center gap-2 mb-6 text-[11px] font-bold">
                    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full transition"
                         th:classappend="${buoc == null or buoc == 1} ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100 text-slate-500'">
                        <span class="w-4 h-4 rounded-full bg-white/20 text-center text-[10px] flex items-center justify-center">1</span>
                        <span>Nhập Email</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-[10px] text-slate-300"></i>
                    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full transition"
                         th:classappend="${buoc == 2} ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100 text-slate-500'">
                        <span class="w-4 h-4 rounded-full bg-white/20 text-center text-[10px] flex items-center justify-center">2</span>
                        <span>Xác thực OTP</span>
                    </div>
                </div>

                <!-- Alert Lỗi -->
                <div th:if="${thongBaoLoi}" class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 flex items-start text-rose-800 text-xs shadow-xs">
                    <i class="fa-solid fa-circle-exclamation text-base mr-2.5 mt-0.5 text-rose-600 flex-shrink-0"></i>
                    <span th:text="${thongBaoLoi}"></span>
                </div>

                <!-- Alert Thành công -->
                <div th:if="${thongBaoThanhCong}" class="mb-5 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 flex items-start text-emerald-800 text-xs shadow-xs">
                    <i class="fa-solid fa-circle-check text-base mr-2.5 mt-0.5 text-emerald-600 flex-shrink-0"></i>
                    <span th:text="${thongBaoThanhCong}"></span>
                </div>

                <!-- BƯỚC 1 -->
                <div th:if="${buoc == null or buoc == 1}">
                    <form th:object="${yeuCauQuenMatKhauRequest}" th:action="@{/admin/quen-mat-khau/gui-otp}" method="post" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                                Địa chỉ Email nhân viên <span class="text-rose-500">*</span>
                            </label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                    <i class="fa-regular fa-envelope text-sm"></i>
                                </span>
                                <input type="email" th:field="*{email}" placeholder="Ví dụ: nhanvien@simplain.vn hoặc Gmail..." required
                                       class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none text-sm transition">
                            </div>
                            <p class="text-rose-500 text-xs mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                        </div>

                        <button type="submit"
                                class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl uppercase tracking-wider text-xs transition duration-200 shadow-md shadow-blue-500/25 mt-4 flex items-center justify-center cursor-pointer">
                            <i class="fa-solid fa-paper-plane mr-2 text-xs"></i>
                            <span>GỬI MÃ XÁC THỰC OTP QUA GMAIL</span>
                        </button>
                    </form>
                </div>

                <!-- BƯỚC 2 -->
                <div th:if="${buoc == 2}">
                    <form th:object="${xacNhanDoiMatKhauRequest}" th:action="@{/admin/quen-mat-khau/dat-lai}" method="post" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Email nhận OTP</label>
                            <input type="email" th:field="*{email}" readonly
                                   class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 text-xs font-semibold outline-none cursor-not-allowed">
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                                Mã OTP xác thực (6 chữ số) <span class="text-rose-500">*</span>
                            </label>
                            <input type="text" th:field="*{maOtp}" placeholder="Nhập 6 số..." maxlength="6" pattern="[0-9]{6}" required
                                   class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100 outline-none text-base font-mono font-bold tracking-widest text-emerald-800 transition">
                            <p class="text-rose-500 text-xs mt-1" th:if="${#fields.hasErrors('maOtp')}" th:errors="*{maOtp}"></p>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                                Mật khẩu mới <span class="text-rose-500">*</span>
                            </label>
                            <input type="password" th:field="*{matKhauMoi}" placeholder="Tối thiểu 6 ký tự..." required minlength="6"
                                   class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none text-sm transition">
                            <p class="text-rose-500 text-xs mt-1" th:if="${#fields.hasErrors('matKhauMoi')}" th:errors="*{matKhauMoi}"></p>
                        </div>

                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                                Xác nhận lại mật khẩu mới <span class="text-rose-500">*</span>
                            </label>
                            <input type="password" th:field="*{xacNhanMatKhauMoi}" placeholder="Nhập lại mật khẩu..." required minlength="6"
                                   class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-blue-600 focus:ring-2 focus:ring-blue-100 outline-none text-sm transition">
                            <p class="text-rose-500 text-xs mt-1" th:if="${#fields.hasErrors('xacNhanMatKhauMoi')}" th:errors="*{xacNhanMatKhauMoi}"></p>
                        </div>

                        <button type="submit"
                                class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl uppercase tracking-wider text-xs transition duration-200 shadow-md shadow-emerald-600/25 mt-4 flex items-center justify-center cursor-pointer">
                            <i class="fa-solid fa-check-double mr-2 text-xs"></i>
                            <span>ĐẶT LẠI MẬT KHẨU CMS</span>
                        </button>
                    </form>
                </div>

                <div class="mt-6 pt-5 border-t border-slate-200 text-center text-xs text-slate-500">
                    <a href="/admin/dang-nhap" class="text-blue-600 font-bold hover:underline">Quay lại trang Đăng nhập CMS</a>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
