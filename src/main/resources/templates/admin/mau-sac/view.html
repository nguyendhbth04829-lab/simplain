<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật Màu sắc | SIMPLAIN STORE CMS</title>
    <script th:src="@{/js/tailwind.js}" src="/js/tailwind.js"></script>
    <link th:href="@{/vendor/fontawesome/css/all.min.css}" href="/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .error { color: #ef4444; font-size: 0.75rem; font-weight: 600; margin-top: 0.25rem; display: block; }
    </style>
</head>
<body class="bg-neutral-50 text-neutral-800 flex flex-col min-h-screen">

    <div class="bg-black text-white text-xs py-2 text-center font-medium tracking-wide">
        Hệ thống Quản trị SIMPLAIN STORE &bull; Cập nhật Màu sắc Sản phẩm (US07)
    </div>

    <!-- Thanh Menu Điều hướng Đa Chức năng dùng chung -->
    <div th:replace="~{admin/fragments/menu-quan-tri :: menuQuanTri('mau-sac')}"></div>

    <main class="lg:pl-64 flex-grow w-full p-4 sm:p-6 lg:p-8 bg-[#f8fafc]">
        <div class="max-w-2xl mx-auto space-y-5">

        <div th:if="${thongBaoLoi}" class="bg-red-50 border border-red-200 text-red-700 px-5 py-3.5 rounded-2xl flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-2.5 text-xs sm:text-sm font-semibold">
                <i class="fa-solid fa-triangle-exclamation text-red-600 text-base"></i>
                <span th:text="${thongBaoLoi}">Dữ liệu chưa hợp lệ!</span>
            </div>
            <button onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-800"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-sm border border-slate-200/90">
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center font-bold text-base">
                        <i class="fa-solid fa-palette"></i>
                    </div>
                    <div>
                        <span class="text-[10px] font-extrabold text-blue-700 bg-blue-50 border border-blue-200 px-2.5 py-0.5 rounded-full uppercase tracking-wider">US07 &bull; Chỉnh sửa</span>
                        <h2 class="text-xl font-black text-slate-900 uppercase tracking-wide mt-1">Cập nhật Màu sắc</h2>
                    </div>
                </div>
                <a href="/admin/mau-sac/hien-thi" class="btn-outline px-3.5 py-2 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-arrow-left mr-1.5"></i>Quay lại danh sách
                </a>
            </div>

            <form th:object="${mauSac}" action="/admin/mau-sac/update" method="post" class="space-y-4" novalidate>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">ID Màu sắc</label>
                    <input type="text" th:field="*{id}" readonly class="w-full rounded-xl border-slate-200 bg-slate-100 text-slate-500 text-xs p-2.5 border outline-none cursor-not-allowed font-mono">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Mã màu (Hex / Code) <span class="text-rose-500 font-bold">*</span></label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="colorPickerEdit"
                               th:value="${mauSac.maMau != null and #strings.startsWith(mauSac.maMau, '#') and #strings.length(mauSac.maMau) == 7 ? mauSac.maMau : '#000000'}"
                               onchange="document.getElementById('maMauEditInput').value = this.value.toUpperCase()"
                               class="w-11 h-10 p-0.5 rounded-xl border border-slate-300 cursor-pointer bg-white">
                        <input type="text" id="maMauEditInput" th:field="*{maMau}"
                               class="flex-1 rounded-xl border border-slate-300 bg-slate-50/60 focus:bg-white text-xs font-mono uppercase p-2.5 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-slate-800 transition font-medium">
                    </div>
                    <span class="error" th:if="${#fields.hasErrors('maMau')}" th:errors="*{maMau}"></span>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Tên màu sắc <span class="text-rose-500 font-bold">*</span></label>
                    <input type="text" th:field="*{tenMau}" class="w-full rounded-xl border border-slate-300 bg-slate-50/60 focus:bg-white text-xs p-2.5 outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-slate-800 transition font-medium">
                    <span class="error" th:if="${#fields.hasErrors('tenMau')}" th:errors="*{tenMau}"></span>
                </div>

                <div class="pt-2">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Trạng thái</label>
                    <div class="flex items-center space-x-6 text-xs">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" th:field="*{kichHoat}" value="true" class="text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer">
                            <span class="ml-2 font-medium text-slate-700">Còn hoạt động</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" th:field="*{kichHoat}" value="false" class="text-blue-600 focus:ring-blue-500 w-4 h-4 cursor-pointer">
                            <span class="ml-2 font-medium text-slate-700">Tạm ngưng</span>
                        </label>
                    </div>
                </div>

                <div class="pt-4 flex gap-3 border-t border-slate-100">
                    <button type="submit" class="flex-1 btn-navy font-bold py-2.5 px-4 rounded-xl text-xs uppercase tracking-wider shadow-sm flex items-center justify-center gap-1.5 cursor-pointer transition">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Lưu cập nhật</span>
                    </button>
                    <a href="/admin/mau-sac/hien-thi" class="flex-1 text-center btn-outline font-semibold py-2.5 px-4 rounded-xl text-xs uppercase tracking-wider shadow-sm flex items-center justify-center gap-1.5 transition">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Quay lại</span>
                    </a>
                </div>
            </form>
        </div>
        </div>
    </main>

</body>
</html>
