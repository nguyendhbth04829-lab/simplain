spring.application.name=Simplain
server.port=8080

# --- Cấu hình chuẩn hóa bảng mã UTF-8 toàn hệ thống (Chống lỗi phông chữ tiếng Việt) ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8

# --- Tài liệu API kiểu FastAPI docs (Swagger UI) ---
# Trang gọi thử giống FastAPI: /docs
# File JSON thô:               /v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# --- Kết nối Cơ sở dữ liệu SQL Server (Hỗ trợ Unicode / NVARCHAR tiếng Việt) ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Simpl4;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# --- Cấu hình Upload hình ảnh và video quảng cáo sản phẩm (Lên tới 100MB) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.max-part-count=5000
server.tomcat.max-parameter-count=10000

# --- Cấu hình Gửi Email xác thực OTP qua Gmail SMTP ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lelin789pp@gmail.com
