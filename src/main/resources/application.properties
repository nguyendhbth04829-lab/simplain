spring.application.name=Simplain
server.port=8080

# --- Tai lieu API kieu FastAPI docs (Swagger UI) ---
# Trang goi thu giong FastAPI: /docs
# File JSON tho:               /v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# --- Cau hinh Database (H2 che do file tuong thich MSSQL Server) ---
# Luu tru vao file ./data/simpl4 (khong mat khi tat app), ho tro che do MSSQL
spring.datasource.url=jdbc:h2:file:./data/simpl4;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 Console (Giao dien quan tri DB tren trinh duyet tai: http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
