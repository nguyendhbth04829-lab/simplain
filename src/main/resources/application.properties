spring.application.name=Simplain
server.port=8080

# --- Tai lieu API kieu FastAPI docs (Swagger UI) ---
# Trang goi thu giong FastAPI: /docs
# File JSON tho:               /v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# --- Cau hinh Co so du lieu SQL Server ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Simpl4;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Cau hinh JWT (US01) ---
simplain.jwt.secret=simplain-secret-key-for-jwt-token-authentication-secure-256-bits-2026!
simplain.jwt.expiration-ms=86400000
simplain.jwt.issuer=simplain-auth
